name: CommitQuest Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:[[:space:]].+ ]]; then
            echo "Use a Conventional Commit pull-request title."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Upload immutable web artifact
        uses: actions/upload-artifact@v7
        with:
          name: commitquest-web-${{ github.sha }}
          path: |
            apps/web/dist/commitquest-web/browser
            apps/web/dist/commitquest-web/3rdpartylicenses.txt
          if-no-files-found: error
          retention-days: 14

  api-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew check --no-daemon
      - name: Require PostgreSQL integration tests
        run: |
          result="build/test-results/test/TEST-com.commitquest.campaign.provider.postgresql.JooqSavedCampaignStoreIntegrationTest.xml"
          if [[ ! -f "$result" ]] || ! grep -q 'skipped="0"' "$result"; then
            echo "The PostgreSQL migration and adapter integration suite did not execute."
            exit 1
          fi
