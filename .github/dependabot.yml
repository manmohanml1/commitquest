version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
      testing-and-quality:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'vitest'
          - 'jsdom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
