spring:
  application:
    name: commitquest-api
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jooq.autoconfigure.JooqAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8081}
  error:
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

commitquest:
  identity:
    enabled: ${COMMITQUEST_IDENTITY_ENABLED:false}
    client-id: ${COMMITQUEST_GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${COMMITQUEST_GITHUB_OAUTH_CLIENT_SECRET:}
    public-base-url: ${COMMITQUEST_PUBLIC_BASE_URL:https://commitquest-web.vercel.app}
    authorization-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    api-base-url: https://api.github.com
    hmac-secret: ${COMMITQUEST_IDENTITY_HMAC_SECRET:}
    connect-timeout: 3s
    read-timeout: 8s
  persistence:
    enabled: ${COMMITQUEST_PERSISTENCE_ENABLED:false}
    url: ${COMMITQUEST_DATABASE_URL:}
    username: ${COMMITQUEST_DATABASE_USERNAME:}
    password: ${COMMITQUEST_DATABASE_PASSWORD:}
    maximum-pool-size: ${COMMITQUEST_DATABASE_POOL_SIZE:3}
  github:
    base-url: https://api.github.com
    token: ${COMMITQUEST_GITHUB_TOKEN:}
    connect-timeout: 3s
    read-timeout: 8s
  web:
    allowed-origin-patterns:
      - http://localhost:4200
      - http://localhost:4201
      - http://127.0.0.1:4200
      - http://127.0.0.1:4201
      - https://commitquest-web.vercel.app
      - https://commitquest-web-*.vercel.app
